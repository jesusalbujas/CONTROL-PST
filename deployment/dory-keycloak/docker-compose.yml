version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dory_keycloak_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: keycloak/keycloak:26.6
    container_name: dory_keycloak_app
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_PROXY: edge
      KC_LOG_LEVEL: INFO
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-3334}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak_network
    restart: unless-stopped
    volumes:
      - ./dory-theme:/opt/keycloak/themes/dory-theme
      - ./adempiere-realm.json:/opt/keycloak/data/import/adempiere-realm.json

networks:
  keycloak_network:
    driver: bridge

volumes:
  postgres_data:
